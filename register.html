<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Whale Watching & Marine Eco-Tours</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="icon" type="image/png" href="assets/images/website-logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <style>
        body {
            background: linear-gradient(135deg, #f0f8ff 0%, #e0f0ff 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        body.dark-mode {
            background: linear-gradient(135deg, #001f3f 0%, #003366 100%);
        }

        .register-card {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            text-align: center;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 15px;
            transition: var(--transition);
        }
        body.dark-mode .register-card {
            background: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: none;
        }

        .register-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background: #fff;
            color: #333;
            transition: var(--transition);
        }
        body.dark-mode .register-card input {
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: white;
        }

        .register-card input::placeholder { color: #999; }
        body.dark-mode .register-card input::placeholder { color: rgba(255, 255, 255, 0.7); }

        .register-card .logo {
            justify-content: center;
            margin-bottom: 30px;
            color: var(--primary-color);
        }
        body.dark-mode .register-card .logo { color: white; }
        
        .register-card h2 { color: var(--primary-color); }
        body.dark-mode .register-card h2 { color: white !important; }

        .password-strength {
            height: 5px;
            background: transparent;
            margin-bottom: 15px;
            border-radius: 5px;
            overflow: hidden;
            text-align: left;
        }
        body.dark-mode .password-strength {
            background: transparent;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            background: var(--secondary-color);
            transition: 0.3s;
        }

        .password-field {
            position: relative;
            width: 100%;
        }

        .password-field i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            z-index: 10;
        }
        body.dark-mode .password-field i { color: rgba(255, 255, 255, 0.7); }

        .password-field input {
            padding-right: 45px !important;
            margin-bottom: 0 !important;
        }
        
        .field-group { margin-bottom: 15px; }

        .auth-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .auth-controls .toggle-btn {
            background: #fff;
            border: 1px solid #ccc;
            color: var(--primary-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        body.dark-mode .auth-controls .toggle-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(5px);
            box-shadow: none;
        }

        .auth-controls .toggle-btn:hover {
            background: #f0f0f0;
            transform: translateY(-3px);
        }
        body.dark-mode .auth-controls .toggle-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .social-auth-btns button {
            color: #333;
            border: 1px solid #ddd;
            background: #f9f9f9;
        }
        body.dark-mode .social-auth-btns button {
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
        }
        .social-auth-btns button i { color: #333; }
        body.dark-mode .social-auth-btns button i { color: white; }

        @media (max-width: 576px) {
            body {
                flex-direction: column !important;
                height: auto !important;
                padding: 40px 0 !important;
            }
            .auth-controls {
                position: static !important;
                margin-bottom: 20px !important;
                justify-content: flex-end !important;
                width: 100% !important;
                padding-right: 20px !important;
            }
        }
            .or-text { color: #666; }
        body.dark-mode .or-text { color: rgba(255, 255, 255, 0.6); }
    </style>
</head>

<body>

    <div class="auth-controls">
        <button id="darkModeToggle" class="toggle-btn"><i class="fas fa-moon"></i></button>
        <button id="rtlToggle" class="toggle-btn"><i class="fas fa-right-left"></i></button>
    </div>

    <div class="register-card glass reveal">
        <a href="index.html" class="logo"><img src="assets/images/website-logo.png" alt="Logo" style="height: 50px; margin-bottom: 10px;"><span>MarineTours</span></a>
        <h2 style="margin-bottom: 20px;">Join the Expedition</h2>
        <form action="index.html">
            <div class="field-group">
                <input type="text" placeholder="First Name" required>
            </div>
            <div class="field-group">
                <input type="text" placeholder="Last Name" required>
            </div>
            <div class="field-group">
                <input type="email" placeholder="Email Address" required>
            </div>
            <div class="field-group">
                <div class="password-field">
                    <input type="password" id="password" placeholder="Password" required oninput="checkStrength(this.value)">
                    <i class="fas fa-eye" onclick="togglePassword('password', this)"></i>
                </div>
                <div class="password-strength">
                    <div id="strength-bar" class="strength-bar"></div>
                </div>
            </div>
            <div class="field-group">
                <div class="password-field">
                    <input type="password" id="confirm-password" placeholder="Confirm Password" required>
                    <i class="fas fa-eye" onclick="togglePassword('confirm-password', this)"></i>
                </div>
            </div>
            <button type="submit" class="btn btn-accent" style="width: 100%; margin-bottom: 20px;">Create Account</button>
        </form>    
            <div style="display: flex; align-items: center; margin-bottom: 20px;">
                <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.2);"></div>
                <span class="or-text" style="padding: 0 10px; font-size: 0.8rem;">OR SIGN UP WITH</span>
                <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.2);"></div>
            </div>

            <div class="social-auth-btns" style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button type="button" class="btn" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; font-size: 0.9rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Google
                </button>
                <button type="button" class="btn" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; font-size: 0.9rem;">
                    <i class="fab fa-apple" style="font-size: 1.2rem;"></i>
                    Apple
                </button>
            </div>
        </form>
        <p style="margin-top: 20px; font-size: 0.9rem;">Already have an account? <a href="login.html"
                style="color: var(--accent-color); font-weight: 600;">Login Here</a></p>
    </div>

    <script>
        function checkStrength(password) {
            let strength = 0;
            if (password.length > 5) strength += 25;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength += 25;
            if (password.match(/[0-9]/)) strength += 25;
            if (password.match(/[^a-zA-Z0-9]/)) strength += 25;

            const bar = document.getElementById('strength-bar');
            bar.style.width = strength + '%';
            if (strength < 50) bar.style.background = '#ff4d4d';
            else if (strength < 75) bar.style.background = '#ffd11a';
            else bar.style.background = '#00ff00';
        }

        function togglePassword(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
    <script src="assets/js/main.js"></script>
</body>

</html>
