<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching Soon | Whale Watching & Marine Eco-Tours</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="assets/images/website-logo.png">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0, 31, 63, 0.9), rgba(0, 31, 63, 0.9)), url('https://images.unsplash.com/photo-1550951160-843e936b9c97?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        .countdown {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 50px 0;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 30px;
            border-radius: 15px;
            min-width: 120px;
        }

        .time-box span {
            display: block;
            font-size: 3rem;
            font-weight: 700;
            color: var(--secondary-color);
        }
        h1 {
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <a href="index.html" class="logo" style="justify-content: center; color: white; margin-bottom: 30px;"><img src="assets/images/website-logo.png" alt="Logo" style="height: 100px;"><span style="font-size: 2.5rem;">MarineTours</span></a>
        <h1>Our New Expedition is Launching Soon</h1>
        <p style="opacity: 0.8; max-width: 600px; margin: 20px auto;">We're currently scouting new migration routes and
            upgrading our fleet. Join our list to get early bird access.</p>

        <div class="countdown" id="countdown">
            <div class="time-box"><span id="days">00</span> Days</div>
            <div class="time-box"><span id="hours">00</span> Hours</div>
            <div class="time-box"><span id="minutes">00</span> Mins</div>
            <div class="time-box"><span id="seconds">00</span> Secs</div>
        </div>

        <form class="newsletter-form" style="max-width: 500px; margin: 0 auto; display: flex; gap: 10px;">
            <input type="email" placeholder="Your Email Address" required
                style="flex: 1; padding: 15px; border-radius: 5px; border: none;">
            <button type="submit" class="btn btn-accent">Notify Me</button>
        </form>

        <div class="social-links" style="justify-content: center; margin-top: 50px;">
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>

            <a href="#"><i class="fab fa-youtube"></i></a>
            <a href="#"><i class="fab fa-linkedin"></i></a>
        </div>
    </div>


    <script src="assets/js/main.js"></script>
</body>

</html>
