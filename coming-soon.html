<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching Soon | Whale Watching & Marine Eco-Tours</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0,31,63,0.9), rgba(0,31,63,0.9)), url('https://images.unsplash.com/photo-1550951160-843e936b9c97?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            color: white;
            text-align: center;
            overflow: hidden;
        }
        .countdown {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 50px 0;
        }
        .time-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            padding: 30px;
            border-radius: 15px;
            min-width: 120px;
        }
        .time-box span {
            display: block;
            font-size: 3rem;
            font-weight: 700;
            color: var(--secondary-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="logo" style="justify-content: center; color: white; margin-bottom: 30px;">
            <i class="fas fa-whale" style="font-size: 3rem;"></i>
            <span style="font-size: 2.5rem;">MarineTours</span>
        </a>
        <h1>Our New Expedition is Launching Soon</h1>
        <p style="opacity: 0.8; max-width: 600px; margin: 20px auto;">We're currently scouting new migration routes and upgrading our fleet. Join our list to get early bird access.</p>
        
        <div class="countdown" id="countdown">
            <div class="time-box"><span id="days">00</span> Days</div>
            <div class="time-box"><span id="hours">00</span> Hours</div>
            <div class="time-box"><span id="minutes">00</span> Mins</div>
            <div class="time-box"><span id="seconds">00</span> Secs</div>
        </div>

        <form class="newsletter-form" style="max-width: 500px; margin: 0 auto; display: flex; gap: 10px;">
            <input type="email" placeholder="Your Email Address" required style="flex: 1; padding: 15px; border-radius: 5px; border: none;">
            <button type="submit" class="btn btn-accent">Notify Me</button>
        </form>

        <div class="social-links" style="justify-content: center; margin-top: 50px;">
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
            <a href="#"><i class="fab fa-linkedin"></i></a>
        </div>
    </div>

    <div class="wave-divider" style="position: absolute; bottom: 0; width: 100%;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="#f0f8ff" fill-opacity="0.2" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,224C672,245,768,267,864,250.7C960,235,1056,181,1152,149.3C1248,117,1344,107,1392,101.3L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
