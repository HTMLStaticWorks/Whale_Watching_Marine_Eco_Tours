<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Whale Watching & Marine Eco-Tours</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1550951160-843e936b9c97?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
            color: white;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .login-card input::placeholder {
            color: rgba(255,255,255,0.7);
        }
        .login-card .logo {
            justify-content: center;
            margin-bottom: 30px;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card glass reveal">
        <a href="index.html" class="logo">
            <i class="fas fa-whale"></i>
            <span>MarineTours</span>
        </a>
        <h2 style="color: white; margin-bottom: 20px;">Welcome Back</h2>
        <form action="dashboard.html">
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" required>
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; margin-bottom: 20px;">
                <label><input type="checkbox" style="width: auto; margin-right: 5px;"> Remember Me</label>
                <a href="#" style="color: var(--secondary-color);">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-accent" style="width: 100%;">Login</button>
        </form>
        <p style="margin-top: 20px; font-size: 0.9rem;">Don't have an account? <a href="register.html" style="color: var(--secondary-color);">Register Here</a></p>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
